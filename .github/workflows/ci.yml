name: Validation infrastructure
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuser les secrets suivis
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then exit 1; fi
      - name: Générer des secrets éphémères
        run: ./scripts/generate-secrets.sh
      - name: Valider Compose et scripts
        run: ./scripts/validate.sh
  custom-image:
    name: Build Rallly fork image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Générer des secrets de validation éphémères
        run: ./scripts/generate-secrets.sh
      - name: Construire le fork au commit figé
        run: docker compose -f compose.yaml -f compose.custom.yaml build rallly
      - name: Vérifier l’utilisateur non-root et la révision
        run: |
          test "$(docker image inspect m2-rallly:413ff340d --format '{{.Config.User}}')" = nextjs
          test "$(docker image inspect m2-rallly:413ff340d --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = 413ff340dd2dab415e1779776262ce9a402a71ec
