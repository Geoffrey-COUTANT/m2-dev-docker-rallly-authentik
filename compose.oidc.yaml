# Ajouter ce fichier seulement après la création du provider Authentik.
services:
  rallly:
    environment:
      OIDC_NAME: Authentik
      OIDC_DISCOVERY_URL: http://authentik.localhost:8080/application/o/rallly/.well-known/openid-configuration
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-rallly}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Configurer le provider Authentik puis renseigner ce secret}
